name: CI

on:
  push:
  pull_request:

jobs:
  build:
    # PS3Kit uses Network.framework and CryptoKit, and the app is SwiftUI: macOS only.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Test PS3Kit
        run: swift test

      - name: Build CLI
        run: swift build -c release

      - name: Build app
        run: |
          brew install xcodegen
          make project
          xcodebuild -project App/PS3Center.xcodeproj -scheme PS3Center -derivedDataPath .build/xcode \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build
