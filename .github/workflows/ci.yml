name: CI

# One run per commit: pushes to main, and pull requests (which cover their branch's pushes).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # PS3Kit uses Network.framework and CryptoKit, and the app is SwiftUI: macOS only.
    # GitHub's runners cost nothing for a public repository. While it is private, the repository
    # variable CI_RUNNER=self-hosted runs the job on a Mac of your own (Settings → Actions →
    # Runners); never on a public one, where a pull request from a fork could run code on it.
    runs-on: ${{ vars.CI_RUNNER || 'macos-15' }}
    # Actions are pinned to a commit (the v4 tag when this was written), so a moved tag can't
    # change what runs here. Update them deliberately.
    env:
      XCODEGEN_VERSION: "2.46.0"
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      # The package's dependencies (swift-argument-parser), not the build itself.
      - name: Cache Swift packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            .build/checkouts
            .build/repositories
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # The same XcodeGen as on the Mac (`xcodegen --version`), checked against the release's
      # digest, instead of whatever Homebrew has that day.
      - name: Install XcodeGen
        run: |
          dir="$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION"
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$dir"
          echo "$dir/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Test PS3Kit and the CLI
        run: swift test

      - name: Build CLI
        run: swift build -c release

      - name: Build app
        run: |
          xcodegen --version
          make project
          xcodebuild -project App/PS3Center.xcodeproj -scheme PS3Center -derivedDataPath .build/xcode \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build

      # Every screen rendered from PS3Kit's Fixtures, so a design change can be reviewed without a PS3.
      - name: Render screenshots
        run: |
          out="$PWD/.build/snapshots"
          rm -rf "$out"
          mkdir -p "$out"
          PS3CENTER_FIXTURES=1 PS3CENTER_SNAPSHOT_DIR="$out" \
            ".build/xcode/Build/Products/Debug/PS3 Center.app/Contents/MacOS/PS3 Center" &
          pid=$!
          for _ in $(seq 1 120); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          kill "$pid" 2>/dev/null || true
          ls -l "$out"
          test -f "$out/status.png" && test -f "$out/apps-detail.png"

      - name: Upload screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: screenshots
          path: .build/snapshots/*.png
          if-no-files-found: error
