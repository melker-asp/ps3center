# Generates PS3Center.xcodeproj: `xcodegen` in this folder (or `make app` one level up).
name: PS3Center
options:
  bundleIdPrefix: local.ps3center
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  PS3Center:
    path: ..
targets:
  PS3Center:
    type: application
    platform: macOS
    sources:
      - path: Sources
    # Generated next to the sources by xcodegen (not checked in); merged with the INFOPLIST_KEY_ settings.
    info:
      path: Sources/Info.plist
      properties:
        NSAppTransportSecurity:
          # webMAN on the console is plain HTTP on the local network.
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            # Sony's game update packages are served over plain HTTP (b0.ww.np.dl.playstation.net);
            # each one is checked against the SHA-1 in Sony's update list before it is installed.
            playstation.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        # Finder: "Send to PS3" under Services and Quick Actions (ServiceProvider in Inbox.swift).
        NSServices:
          - NSMenuItem:
              default: Send to PS3
            NSMessage: sendToPS3
            NSPortName: PS3 Center
            NSRequiredContext: {}
            NSSendFileTypes:
              - public.item
    dependencies:
      - package: PS3Center
        product: PS3Kit
      # Canned data for PS3CENTER_FIXTURES=1 (CI's screenshots).
      - package: PS3Center
        product: PS3KitFixtures
    settings:
      base:
        PRODUCT_NAME: PS3 Center
        PRODUCT_BUNDLE_IDENTIFIER: local.ps3center.app
        # The same as `version:` in Sources/ps3/PS3.swift; scripts/dist.sh refuses a release when they differ.
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: $(MARKETING_VERSION)
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PS3 Center
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: PS3 Center talks to webMAN on your PS3 over the local network.
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Melker Asp. Free software under the GPL-3.0. Not affiliated with Sony."
        # Sources/Assets.xcassets/AppIcon.appiconset, rendered by scripts/make_icon.swift (`make icon`).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # No sandbox, signed ad hoc: there is no Developer ID, so releases aren't notarized and
        # macOS asks the user to allow the app once (README.md → Download).
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
